services:
  
  actual:
    image: docker.io/actualbudget/actual-server:${ACTUAL_VERSION:-latest}
    env_file: environment.d/actual.env
    # environment:
    #   ...
    ports:
      - ${ACTUAL_PORT:-5006}:5006
    volumes:
      - ${ACTUAL_DATA_VOLUME:-actual-data}:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_VERSION:-latest}
    env_file: environment.d/watchtower.env
    environment:
      WATCHTOWER_SCOPE: ${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped
    
volumes:
  actual-data: {}
